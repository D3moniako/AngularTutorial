<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />

    <title>DreamCalendar</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      body {
        margin: 0;

        min-height: 100vh;

        display: flex;

        align-items: center;

        justify-content: center;

        font-family: "Poppins", Arial, sans-serif;

        background: linear-gradient(135deg, #ffd8ea, #ddd2ff);

        color: #60465c;
      }

      .box {
        background: white;

        padding: 45px;

        border-radius: 40px;

        text-align: center;

        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.15);

        max-width: 450px;
      }

      h1 {
        font-size: 70px;

        margin: 0;

        background: linear-gradient(90deg, #d63384, #9b5de5);

        -webkit-background-clip: text;

        color: transparent;
      }

      h2 {
        font-size: 28px;

        color: #d48aa9;
      }

      p {
        font-size: 17px;

        color: #777;

        line-height: 1.6;
      }

      a {
        display: inline-block;

        margin-top: 25px;

        padding: 15px 35px;

        border-radius: 35px;

        text-decoration: none;

        font-weight: 700;

        color: white;

        background: linear-gradient(90deg, #d63384, #9b5de5);

        transition: 0.3s;
      }

      a:hover {
        transform: scale(1.05);

        box-shadow: 0 15px 35px rgba(214, 51, 132, 0.35);
      }

      .flower {
        font-size: 50px;
      }
    </style>
  </head>

  <body>
    <div class="box">
      <div class="flower">🌸</div>

      <h1>404</h1>

      <h2>Pagina non trovata</h2>

      <p>
        La pagina che stai cercando non esiste oppure è stata spostata. Torna a
        DreamCalendar e continua a organizzarti con stile.
      </p>

      <a href="/"> 🏠 Torna alla Home </a>
    </div>
  </body>
</html>
