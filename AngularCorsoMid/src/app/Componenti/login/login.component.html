<div class="login-page">


<section class="login-box">



<h1>

🌸 Bentornato

</h1>




<input

type="email"

placeholder="Email"

[(ngModel)]="email">






<input

type="password"

placeholder="Password"

[(ngModel)]="password">





<button

(click)="login()">

Accedi

</button>





<p

class="error"

*ngIf="errorMessage">

{{errorMessage}}

</p>






<p>


Non hai un account?


<a routerLink="/register">

Registrati

</a>


</p>




</section>


</div>
