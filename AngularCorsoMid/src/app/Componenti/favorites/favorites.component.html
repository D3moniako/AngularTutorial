<div class="favorites-page">


<section class="favorites-header">


<h1>

❤️ I tuoi Planner preferiti

</h1>


<p>

I planner che hai salvato per ritrovarli facilmente.

</p>


</section>





<section class="favorites-grid">



<div

class="empty"

*ngIf="favorites.length===0">


<h2>

Nessun preferito ancora 🌸

</h2>


<a routerLink="/shop">

Vai allo Shop

</a>


</div>






<div

class="favorite-card"

*ngFor="let p of favorites">



<img

[src]="p.image"

[alt]="p.name">





<h2>

{{p.name}}

</h2>



<p>

{{p.description}}

</p>



<strong>

{{p.price | currency:'EUR'}}

</strong>





<div class="buttons">


<a

[routerLink]="['/products',p.id]">

Vedi

</a>



<button

(click)="remove(p)">

❌

</button>


</div>




</div>



</section>


</div>
