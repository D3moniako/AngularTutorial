<div class="register-page">


<section class="register-box">


<h1>

🌸 Crea il tuo account

</h1>





<input

type="text"

placeholder="Nome"

[(ngModel)]="user.name"

>






<input

type="email"

placeholder="Email"

[(ngModel)]="user.email"

>







<input

type="tel"

placeholder="Telefono"

[(ngModel)]="user.phone"

>








<input

type="password"

placeholder="Password"

[(ngModel)]="user.password"

>







<input

type="password"

placeholder="Conferma password"

[(ngModel)]="confirmPassword"

>








<label>


<input

type="checkbox"

[(ngModel)]="user.twoFactorEnabled"

>


Attiva autenticazione a due fattori

</label>








<button

(click)="register()"

>


Registrati


</button>







<p>

Hai già un account?


<a routerLink="/login">

Accedi

</a>


</p>



</section>

</div>
