<div class="admin-planners">


<h1>
📅 Gestione Planner
</h1>


<p class="counter">

Totale Planner:
<strong>{{products.length}}</strong>

</p>



<p class="message">

{{message}}

</p>

<div class="filters">


<input

type="text"

placeholder="🔎 Cerca planner..."

[(ngModel)]="searchText"

(input)="filterProducts()">





<select

[(ngModel)]="selectedCategory"

(change)="filterProducts()">



<option

*ngFor="let c of categories"

[value]="c">

{{c}}

</option>



</select>


</div>



<!-- ==========================
     FORM INSERIMENTO / MODIFICA
========================== -->


<section class="add-box">


<h2>

{{editing ? '✏️ Modifica Planner' : '➕ Nuovo Planner'}}

</h2>





<label>
Nome Planner
</label>

<input

type="text"

placeholder="Nome planner"

[(ngModel)]="newPlanner.name">







<label>
Immagine copertina
</label>

<input

type="text"

placeholder="assets/images/calendar/planner.jpg"

[(ngModel)]="newPlanner.image">






<div 
class="preview"
*ngIf="newPlanner.image">


<img

[src]="newPlanner.image"

[alt]="newPlanner.name">


</div>







<label>
Prezzo €
</label>


<input

type="number"

placeholder="14.99"

[(ngModel)]="newPlanner.price">







<label>
Categoria
</label>


<input

type="text"

placeholder="Elegant"

[(ngModel)]="newPlanner.category">







<label>
Badge
</label>


<input

type="text"

placeholder="PREMIUM"

[(ngModel)]="newPlanner.badge">







<label>
PDF Download
</label>


<input

type="text"

placeholder="assets/downloads/planner.pdf"

[(ngModel)]="newPlanner.downloadUrl">







<label>
Descrizione
</label>


<textarea

placeholder="Descrizione planner"

[(ngModel)]="newPlanner.description">

</textarea>







<div class="buttons">


<button

(click)="savePlanner()">


💾

{{editing ? 'Salva modifiche' : 'Pubblica Planner'}}


</button>






<button

*ngIf="editing"

class="cancel"

(click)="resetForm()">



❌ Annulla


</button>


</div>





</section>









<!-- ==========================
     LISTA PLANNER
========================== -->



<section class="list">


<h2>

📚 Planner disponibili

</h2>






<div class="grid">






<div

class="card"

*ngFor="let p of filteredProducts">







<div class="image-box">


<img

*ngIf="p.image"

[src]="p.image"

[alt]="p.name">



<div

*ngIf="!p.image"

class="no-image">


📅

</div>


</div>









<h3>

{{p.name}}

</h3>







<p class="price">

{{p.price | currency:'EUR'}}

</p>







<p>

🏷 {{p.category}}

</p>






<p>

{{p.badge}}

</p>







<div class="card-buttons">



<button

(click)="editPlanner(p)"

class="edit">


✏️ Modifica


</button>





<button

(click)="deletePlanner(p.id)"

class="delete">


🗑 Elimina


</button>



</div>






</div>






</div>





</section>





</div>
