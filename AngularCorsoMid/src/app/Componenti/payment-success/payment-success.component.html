<div class="success-page">
  <div class="box">
    <h1>🎉 Pagamento completato</h1>

    <p>Grazie per il tuo acquisto.</p>

    <p>
      Il tuo ordine:

      <strong> #{{ orderId }} </strong>
    </p>

    <div class="message">
      <span *ngIf="loading"> ⏳ Conferma pagamento in corso... </span>

      <span *ngIf="!loading">
        {{ message }}
      </span>
    </div>

    <button (click)="goPlanner()">📚 Vai ai miei Planner</button>
  </div>
</div>
