<div class="shop-page">


<section class="shop-hero">

<h1>
🌸 Digital Planner Shop
</h1>

<p>
Trova il planner perfetto per organizzare la tua vita con stile.
</p>

</section>



<section class="tools">


<input

type="search"

placeholder="🔍 Cerca planner..."

[(ngModel)]="search"

(input)="applyFilters()"

>




<div class="categories">


<button

type="button"

*ngFor="let c of categories"

(click)="filterCategory(c)"

[class.active]="selectedCategory===c">

{{c}}

</button>


</div>





<select

[(ngModel)]="sort"

(change)="changeSort()">


<option value="default">
Ordina
</option>


<option value="rating">
⭐ Più votati
</option>


<option value="price-low">
Prezzo crescente
</option>


<option value="price-high">
Prezzo decrescente
</option>


</select>



</section>





<section

class="empty"

*ngIf="filteredProducts.length===0">


<h2>
Nessun planner trovato 🌸
</h2>


<p>
Prova a cambiare ricerca o categoria.
</p>


</section>







<section class="products-grid">



<app-product-card

*ngFor="let p of filteredProducts"

[product]="p"

mode="shop"

[showFavorite]="true"

[showCart]="!isPurchased(p.id)"
[showDescription]="true"

[purchased]="isPurchased(p.id)"


(favorite)="toggleFavorite($event)"

(addCart)="addCart($event)">
</app-product-card>


</section>







<div class="go-cart">


<a routerLink="/cart">

🛒 Vai al carrello

</a>


</div>



</div>
