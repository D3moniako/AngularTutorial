<div class="shop-page">


<section class="shop-hero">


<h1>
🌸 Digital Planner Shop
</h1>


<p>
Trova il planner perfetto per organizzare la tua vita con stile.
</p>


</section>





<section class="tools">


<input

type="search"

placeholder="🔍 Cerca planner..."

[(ngModel)]="search"

(input)="applyFilters()"

>





<div class="categories">


<button

type="button"

*ngFor="let c of categories"

(click)="filterCategory(c)"

[class.active]="selectedCategory===c">


{{c}}


</button>


</div>





<select

[(ngModel)]="sort"

(change)="changeSort()">


<option value="default">

Ordina

</option>
<option value="rating">
⭐ Più votati
</option>


<option value="price-low">

Prezzo crescente

</option>


<option value="price-high">

Prezzo decrescente

</option>


</select>


</section>








<section

class="empty"

*ngIf="filteredProducts.length===0">


<h2>

Nessun planner trovato 🌸

</h2>


<p>

Prova a cambiare ricerca o categoria.

</p>


</section>









<section class="products-grid">



<div

class="product-card"

*ngFor="let p of filteredProducts">





<button

type="button"

class="heart"

(click)="toggleFavorite(p)">


{{p.favorite ? '❤️':'🤍'}}


</button>






<img

[src]="p.image"

[alt]="p.name"

loading="lazy"

>







<span class="badge">

{{p.badge}}

</span>







<h2>

{{p.name}}

</h2>







<p>

{{p.description}}

</p>







<div class="price">

{{p.price | currency:'EUR'}}

</div>








<div class="buttons">



<a

class="details"

[routerLink]="['/products',p.id]">


👁 Dettagli


</a>






<button

type="button"

(click)="addCart(p)">


🛒 Aggiungi


</button>




</div>







</div>


</section>








<div class="go-cart">


<a routerLink="/cart">

🛒 Vai al carrello

</a>


</div>




</div>
