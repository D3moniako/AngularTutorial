<p>chat-box works!</p>
<div class="chat-button" (click)="toggle()">💬</div>

<div class="chat-window" *ngIf="open">
  <div class="chat-header">
    <div>
      🌸 DreamCalendar

      <br />

      <small> Assistente online </small>
    </div>

    <button (click)="clearChat()">🗑</button>
  </div>

  <div class="messages">
    <div
      *ngFor="let m of messages"
      [class.user]="m.sender === 'USER'"
      [class.bot]="m.sender === 'BOT'"
      [class.admin]="m.sender === 'ADMIN'"
      class="message"
    >
      <p>
        {{ m.text }}
      </p>

      <span>
        {{ m.date | date: "HH:mm" }}
      </span>
    </div>
  </div>

  <div class="input-area">
    <input
      [(ngModel)]="message"
      (keydown.enter)="send()"
      placeholder="Scrivi un messaggio..."
    />

    <button (click)="send()">➤</button>
  </div>
</div>
