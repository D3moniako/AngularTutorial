<ion-content class="payment-page">

  <section class="success-container">


    <ion-card class="success-card">


      <ion-card-content>


        <!-- ICONA -->

        <div class="success-icon">

          🎉

        </div>



        <h1>
          Pagamento completato
        </h1>



        <p class="subtitle">

          Grazie per il tuo acquisto.

        </p>




        <div class="order-box">


          <span>

            Il tuo ordine

          </span>


          <strong>

            #{{orderId}}

          </strong>


        </div>





        <div class="message">


          <span *ngIf="loading">

            ⏳ Conferma pagamento in corso...

          </span>



          <span *ngIf="!loading">

            {{message}}

          </span>


        </div>







        <ion-button

          expand="block"

          class="planner-button"

          (click)="goPlanner()">


          📚 Vai ai miei Planner


        </ion-button>



      </ion-card-content>



    </ion-card>



  </section>


</ion-content>
