<ion-content class="planner-page">


<!-- HERO -->

<ion-card class="planner-hero">

  <ion-card-content>

    <h1>
      🌸 Trova il Planner perfetto
    </h1>

    <p>
      Organizza tempo, obiettivi e sogni con i nostri planner digitali.
    </p>

  </ion-card-content>

</ion-card>




<!-- SEARCH -->

<ion-card class="tools">

<ion-card-content>


<ion-searchbar

placeholder="🔍 Cerca planner..."

[(ngModel)]="searchText"

(ionInput)="applyFilter()"

animated="true">

</ion-searchbar>




<div class="categories">

<ion-chip

*ngFor="let c of categories"

(click)="filterCategory(c)"

[class.active]="selectedCategory===c">

{{c}}

</ion-chip>


</div>



</ion-card-content>

</ion-card>







<!-- EMPTY -->

<ion-card

class="empty"

*ngIf="filteredProducts.length===0">


<ion-card-content>

<h2>
🌸 Nessun planner trovato
</h2>

</ion-card-content>

</ion-card>







<!-- PRODUCTS -->

<ion-grid class="products-grid">


<ion-row>



<ion-col

size="6"


size-md="6"

*ngFor="let p of filteredProducts">


<app-product-card

[product]="p"

[showFavorite]="true"

[showCart]="true"

[showDescription]="true"


(addCart)="addCart($event)"


(favorite)="toggleFavorite($event)"


(openProduct)="openProduct($event)">


</app-product-card>





</ion-col>


</ion-row>


</ion-grid>








<!-- CART -->

<div class="go-cart">


<ion-button
routerLink="/cart">

🛒 Vai al carrello

</ion-button>

</div>




</ion-content>
