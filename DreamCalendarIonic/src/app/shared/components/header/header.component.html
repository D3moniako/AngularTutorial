

<ion-header>

<ion-toolbar class="dream-toolbar">


<!-- MENU LATERALE -->

<ion-buttons slot="start">

<ion-menu-button menu="main-menu">
</ion-menu-button>

</ion-buttons>




<!-- LOGO -->

<ion-title>

<div class="logo">

<div class="brand">
🌸 DreamCalendar
</div>

<small>
Digital Planner Boutique
</small>

</div>

</ion-title>





<!-- AZIONI UTENTE -->

<ion-buttons slot="end">


<!-- UTENTE NON LOGGATO -->

<ng-container *ngIf="!user">


<ion-button
fill="clear"
(click)="goLogin()">

🔑

</ion-button>



<ion-button
fill="clear"
(click)="goRegister()">

✨

</ion-button>


</ng-container>






<!-- UTENTE LOGGATO -->

<ng-container *ngIf="user">


<ion-button
fill="clear"
routerLink="/profile"
class="profile-button">

🌸

</ion-button>


<ion-button
fill="clear"
(click)="logout()">

🚪

</ion-button>



</ng-container>





<!-- CARRELLO -->

<ion-button
fill="clear"
(click)="goCart()">

🛒

</ion-button>




</ion-buttons>



</ion-toolbar>


</ion-header>

<!-- CAMPANELLA FLOATING -->
<app-notification-dropdown
*ngIf="user">
</app-notification-dropdown>
