<div class="notification-box">


<ion-button
fill="clear"
class="bell"
(click)="toggle()">


🔔


<ion-badge
*ngIf="unread>0">

{{unread}}

</ion-badge>


</ion-button>





<div
class="panel"
*ngIf="open">


<div class="panel-header">


<h3>
🔔 Notifiche
</h3>


<ion-button
size="small"
fill="clear"
(click)="markAll()">

Segna lette

</ion-button>


</div>






<div
class="notification"
*ngFor="let n of notifications"

(click)="read(n)"

[class.unread]="!n.read">



<div class="icon">

{{n.icon}}

</div>




<div>


<strong>

{{n.title}}

</strong>


<p>

{{n.message}}

</p>



<small>

{{n.date | date:'dd/MM/yyyy HH:mm'}}

</small>


</div>



</div>





<div
class="empty"
*ngIf="notifications.length===0">

Nessuna notifica 🌸

</div>



</div>


</div>
